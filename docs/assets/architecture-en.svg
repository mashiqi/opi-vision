<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="cam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#c23152"/>
    </linearGradient>
    <linearGradient id="enc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#e09520"/>
    </linearGradient>
    <linearGradient id="mux" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ecdc4"/>
      <stop offset="100%" stop-color="#3dbdb5"/>
    </linearGradient>
    <linearGradient id="local" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#5a4bd1"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="web" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="900" height="420" rx="12" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="700">OrangePi Zero 3W · Vision Streaming Architecture</text>

  <!-- Row 1: Camera → Encoder -->
  <rect x="30" y="60" width="120" height="44" rx="8" fill="url(#cam)" filter="url(#shadow)"/>
  <text x="90" y="80" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">IMX219</text>
  <text x="90" y="94" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9">1920×1080 Bayer</text>

  <line x1="150" y1="82" x2="195" y2="82" stroke="#e94560" stroke-width="2" marker-end="url(#arrowRed)"/>
  <defs><marker id="arrowRed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0L8,3L0,6Z" fill="#e94560"/></marker></defs>

  <rect x="200" y="60" width="110" height="44" rx="8" fill="rgba(233,69,96,0.15)" stroke="#e94560" stroke-width="1"/>
  <text x="255" y="80" text-anchor="middle" fill="#e94560" font-size="12" font-weight="600">ISP (3A)</text>
  <text x="255" y="94" text-anchor="middle" fill="rgba(233,69,96,0.6)" font-size="9">AE / AWB / AF</text>

  <line x1="310" y1="82" x2="360" y2="82" stroke="#f5a623" stroke-width="2"/>
  <defs><marker id="arrowYel" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0L8,3L0,6Z" fill="#f5a623"/></marker></defs>

  <rect x="365" y="60" width="150" height="44" rx="8" fill="url(#enc)" filter="url(#shadow)"/>
  <text x="440" y="80" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">aw-h264-encoder</text>
  <text x="440" y="94" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9">Cedarc VE2 HW Encoder</text>

  <!-- Arrow down to row 2 -->
  <line x1="440" y1="104" x2="440" y2="140" stroke="#888" stroke-width="2"/>

  <!-- Row 2: ffmpeg mux (center) -->
  <rect x="295" y="145" width="290" height="54" rx="8" fill="url(#mux)" filter="url(#shadow)"/>
  <text x="440" y="167" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">ffmpeg Mux</text>
  <text x="440" y="185" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">H.264 + Opus → MPEG-TS</text>

  <!-- Audio input (left) -->
  <rect x="30" y="150" width="150" height="44" rx="8" fill="rgba(78,205,196,0.12)" stroke="#4ecdc4" stroke-width="1"/>
  <text x="105" y="170" text-anchor="middle" fill="#4ecdc4" font-size="12" font-weight="600">audio.opus</text>
  <text x="105" y="184" text-anchor="middle" fill="rgba(78,205,196,0.6)" font-size="9">48 kHz Stereo</text>

  <line x1="180" y1="172" x2="295" y2="172" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- H.264 pipe input (already connected) -->

  <!-- Row 3: split outputs -->
  <line x1="440" y1="199" x2="440" y2="235" stroke="#888" stroke-width="2"/>
  <line x1="200" y1="245" x2="680" y2="245" stroke="#444" stroke-width="2"/>
  <line x1="200" y1="245" x2="200" y2="260" stroke="#888" stroke-width="2"/>
  <line x1="680" y1="245" x2="680" y2="260" stroke="#888" stroke-width="2"/>

  <!-- Left branch: Local -->
  <rect x="40" y="265" width="230" height="44" rx="8" fill="url(#local)" filter="url(#shadow)"/>
  <text x="155" y="285" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Local MediaMTX</text>
  <text x="155" y="299" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9">UDP 127.0.0.1:8891</text>

  <line x1="155" y1="309" x2="155" y2="345" stroke="#6c5ce7" stroke-width="2"/>

  <rect x="60" y="350" width="90" height="36" rx="6" fill="rgba(108,92,231,0.15)" stroke="#6c5ce7" stroke-width="1"/>
  <text x="105" y="372" text-anchor="middle" fill="#6c5ce7" font-size="12" font-weight="600">RTSP</text>

  <rect x="160" y="350" width="100" height="36" rx="6" fill="rgba(108,92,231,0.15)" stroke="#6c5ce7" stroke-width="1"/>
  <text x="210" y="372" text-anchor="middle" fill="#6c5ce7" font-size="12" font-weight="600">WebRTC</text>

  <!-- Right branch: Cloud -->
  <rect x="555" y="265" width="250" height="44" rx="8" fill="url(#cloud)" filter="url(#shadow)"/>
  <text x="680" y="285" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Cloud MediaMTX</text>
  <text x="680" y="299" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9">SRT/AES :8890</text>

  <line x1="680" y1="309" x2="680" y2="345" stroke="#0ea5e9" stroke-width="2"/>

  <rect x="615" y="350" width="130" height="36" rx="6" fill="rgba(14,165,233,0.15)" stroke="#0ea5e9" stroke-width="1"/>
  <text x="680" y="372" text-anchor="middle" fill="#0ea5e9" font-size="12" font-weight="600">Public WebRTC</text>

  <!-- Footer -->
  <text x="450" y="408" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="9">Allwinner A733 · LPDDR5 · IMX219 · Cedarc VE2 · GStreamer · FFmpeg · MediaMTX 1.9.3</text>
</svg>
